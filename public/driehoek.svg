<!-- Logo Praktijk de Driehoek, woordmerk "de Driehoek".

     LET OP: dit is een reconstructie, geen aangeleverd merkbestand. De praktijk
     had het origineel niet meer en hun domein is vanaf de bouwomgeving niet
     bereikbaar, dus dit is nagebouwd naar een afbeelding: het beeldmerk met de
     hand, het woordmerk gezet uit Parisienne (SIL Open Font License) en omgezet
     naar paden. De schrijfletter is dus een vervanger en niet het origineel.
     Vervang dit bestand zodra het echte logo er is.

     De viewBox heeft lucht boven en onder, net als bij bint.svg: in de
     logostrip krijgt elk logo dezelfde hoogte, en zonder die marge staat dit
     merk optisch groter dan de rest. -->
