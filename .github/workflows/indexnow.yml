name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - 'lib/data/posts.ts'
      - 'lib/data/cases.ts'
      - 'lib/data/branches.ts'
      - 'lib/data/comparisons.ts'
      - 'lib/data/resources.ts'
      - 'lib/data/team.ts'
  schedule:
    # Dagelijks 07:30 UTC, een uur na de artikelgenerator. Vangt de artikelen
    # uit de Soro-feed op, die zonder commit binnenkomen en dus geen push-run
    # veroorzaken.
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = git diff, soro = recente feed-artikelen, all = bulk-resubmit alle URLs'
        type: choice
        options: [auto, soro, all]
        default: auto

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # nodig voor HEAD~1 diff

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ping IndexNow
        run: |
          # Bij een push kijken we naar de diff, op het dagelijkse schema naar
          # de feed. Handmatig starten kan met elke modus.
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="soro"
          else
            MODE="auto"
          fi
          echo "Modus: $MODE"
          npm run indexnow-ping -- --$MODE
