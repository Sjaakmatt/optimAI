name: Generate kennis-artikel

on:
  schedule:
    # Dinsdag en donderdag, 08:00 UTC = 09:00 NL-tijd (10:00 in zomertijd)
    - cron: '0 8 * * 2,4'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optioneel ad-hoc onderwerp (overschrijft backlog)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # we pushen direct naar main, dus we hebben de volledige branch nodig
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate post
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            npm run new-post -- "${{ github.event.inputs.topic }}"
          else
            npm run new-post
          fi

      - name: Verify build
        run: npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push directly to main
        run: |
          # Stage alleen de bestanden die het script kan wijzigen
          git add lib/data/posts.ts scripts/content-backlog.json

          if git diff --staged --quiet; then
            echo "Geen wijzigingen om te committen — script heeft niets toegevoegd."
            exit 0
          fi

          TITLE='${{ steps.gen.outputs.title }}'
          SLUG='${{ steps.gen.outputs.slug }}'
          CLUSTER='${{ steps.gen.outputs.cluster }}'

          git commit -m "kennis: $TITLE" -m "Auto-gegenereerd via scripts/generate-post.ts.

          Slug: $SLUG
          Cluster: $CLUSTER
          Model: claude-sonnet-4-6
          Triggered: ${{ github.event_name }}"

          # Retry-loop voor race conditions (andere pushes tijdens generatie)
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✓ Gepusht naar main (poging $attempt)"
              exit 0
            fi
            echo "Push faalde op poging $attempt, rebase en opnieuw…"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 2))
          done

          echo "✗ Push faalde na 3 pogingen — handmatig ingrijpen nodig"
          exit 1
