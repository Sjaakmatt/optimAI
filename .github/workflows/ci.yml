name: CI

# Deze repo had geen enkele check op een pull request: typecheck en tests
# bestonden wel, maar draaiden alleen lokaal. Daardoor was bijvoorbeeld het
# contract met de werkbak (welk `kind` een ReviewItem mag hebben) alleen in
# types vastgelegd zonder dat iets het afdwong bij een merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 22, niet 20: het test-script geeft glob-patronen mee aan
      # `node --test`, en die worden pas vanaf Node 21 uitgevouwen. Op 20 valt
      # het terug op een letterlijk pad en faalt het met "Could not find".
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Typecheck en tests raken de bouwstap niet. Een fout in een pagina of in
      # de CSS-laag komt er pas hier uit — en de Vercel-check die op een PR
      # verschijnt is de commentaarbot, niet de build. Zonder deze stap kun je
      # dus groen mergen en alsnog een kapotte site hebben.
      - name: Build
        run: npm run build

      # Lint is signalerend, niet blokkerend: de repo heeft bestaande
      # meldingen die los staan van een individuele PR. Zichtbaar houden,
      # maar geen merges tegenhouden tot die achterstand weg is.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

  # Browsertests op de site-agent-widget. Aparte job: een echte browser met een
  # productiebuild duurt langer dan de rest, en dan hoeft de snelle feedback van
  # typecheck en tests daar niet op te wachten.
  #
  # Deze suite raakt geen enkele externe dienst — het chat-endpoint wordt in de
  # test onderschept — dus er zijn geen sleutels nodig en hij kost niets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Alleen Chromium. Beide testprofielen draaien daarop, dus de andere
      # engines zijn hier pure downloadtijd.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Bij een val is de trace het enige waarmee je achteraf kunt zien wat de
      # browser deed. Zonder dit sta je te raden bij een test die alleen in CI
      # omvalt.
      - name: Bewaar rapport bij een val
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7
